language: python

python:
  - "3.10"
  - "3.11"
  - "3.12"

env:
  - DJANGO="Django>=5.2,<5.3"

addons:
  postgresql: "14"

services:
  - postgresql

install:
  - pip install $DJANGO
  - pip install psycopg2-binary>=2.9.0

branches:
  only:
    - master

script:
  - python runtests.py

before_script:
  - psql -c 'create database test;' -U postgres

notifications:
  email:
    recipients:
      - niwi@niwi.be
    on_success: change
    on_failure: change
